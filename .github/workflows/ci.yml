name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  # install, node --check, npm test and openvibe-contracts-check: the shared test job (Track Q).
  test:
    uses: OpenVibers/OpenVibe.Shared/.github/workflows/test.yml@aa570e4815063dc65624a6a486038d83ff6f6ec0
    with:
      contracts-service: tips
      docs-status: true
      # ADR-035: PostgreSQL 18 + PgBouncer (transaction mode) + Valkey 9 containers
      # (openvibe-sdk scripts/test-services.sh). npm test runs every file on PGlite and
      # test/integration.test.js on the containers; test:pg runs the whole suite through PgBouncer and Valkey.
      test: 'eval "$(node_modules/openvibe-sdk/scripts/test-services.sh up)" && npm test && npm run test:pg'
  # Secret scan (gitleaks) and dependency audit, shared by every OpenVibers repo (Track Q).
  security:
    uses: OpenVibers/OpenVibe.Shared/.github/workflows/security.yml@733ac7f8e3f9466f58fdec1db1c9426e5c402c4c
