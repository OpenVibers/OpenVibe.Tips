## ═══════════════════════════════════════════════════════════════
## openvibe.tips — Nginx Configuration (REFERENCE)
##
## Deployed to /etc/nginx/sites-available/openvibe.tips.conf once the launch rule in README.md
## holds (until then the domain keeps its OpenVibe.Sites placeholder). The Node app (port 4610,
## unit openvibe-tips) renders every page, serves the API and the overlay streams. nginx terminates
## TLS, redirects www → apex, rate-limits auth and API, keeps overlay streams unbuffered, keeps
## overlay tokens out of the access log, and never exposes /internal/ (OpenVibe.Events calls
## 127.0.0.1:4610 directly) or /metrics (host-local scrapers only; Node also refuses any request
## carrying X-Forwarded-For).
## ═══════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=ovtips_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=ovtips_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ovtips_forms:10m rate=2r/s;

server {
    listen 80;
    listen [::]:80;
    server_name openvibe.tips www.openvibe.tips;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://openvibe.tips$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.openvibe.tips;
    ssl_certificate     /etc/letsencrypt/live/openvibe.tips/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.tips/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    return 301 https://openvibe.tips$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openvibe.tips;

    ssl_certificate     /etc/letsencrypt/live/openvibe.tips/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.tips/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/openvibe.tips.access.log;
    error_log  /var/log/nginx/openvibe.tips.error.log;
    client_max_body_size 64k;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # Service-to-service only (Events → 127.0.0.1:4610/internal/events). Never public.
    location /internal/ { return 404; }
    # Prometheus text for host-local scrapers only (http://127.0.0.1:4610/metrics).
    location = /metrics { return 404; }

    location /auth/ {
        limit_req zone=ovtips_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:4610;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=ovtips_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:4610;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Overlays: the token is in the path, so these requests are not logged. Streams are long-lived
    # server-sent events: no buffering, a long read timeout (the app sends a heartbeat every 25 s).
    location /overlay/ {
        access_log off;
        proxy_pass http://127.0.0.1:4610;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Tip and dashboard form posts.
    location ~ ^/(dashboard/|[^/]+/tip$) {
        limit_req zone=ovtips_forms burst=10 nodelay;
        proxy_pass http://127.0.0.1:4610;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:4610;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ /\.(?!well-known) { deny all; }
}
